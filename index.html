<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Persona Favorita</title>
    <style>
        /* Estilo Minimalista */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #fdfbfb;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: manipulation;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        h1 {
            font-weight: 300;
            font-size: 24px;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            position: relative;
            height: 60px;
        }
        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 400;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #btn-yes {
            background-color: #ffb7b2;
            color: white;
            z-index: 1;
        }
        #btn-yes:hover {
            background-color: #ff9aa2;
            transform: scale(1.05);
        }
        #btn-no {
            background-color: #e0e0e0;
            color: #777;
            position: absolute;
            right: 20px;
            z-index: 2;
        }
        .fade-in {
            animation: fadeIn 1s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="game-card">
        <h1 id="question">¿Me dejas acompañarte por el resto de tu vida? :3</h1>
        <div class="buttons" id="btn-container">
            <button id="btn-yes" onclick="celebrate()">Sí</button>
            <button id="btn-no" onmouseover="moveButton()" onpointerdown="moveButton()" ontouchstart="moveButton(event)">No</button>
        </div>
    </div>

    <script>
        function moveButton(event) {
            if (event) {
                event.preventDefault();
            }

            const btnNo = document.getElementById('btn-no');
            const container = document.getElementById('game-card');
            
            const padding = 20;
            const maxX = container.clientWidth - btnNo.clientWidth - padding;
            const maxY = container.clientHeight - btnNo.clientHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            btnNo.style.right = 'auto';
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
        }

        function celebrate() {
            const card = document.getElementById('game-card');
            card.innerHTML = `
                <div class="fade-in">
                    <h1 style="color: #ff9aa2; font-size: 28px;">¡Gracias por estar aquí! ✨</h1>
                    <p style="font-weight: 300; color: #666; line-height: 1.6;">
                        Solo quería recordarte que siempre puedes contar conmigo. En los días buenos y en los no tan buenos, aquí estaré para escucharte, apoyarte y acompañarte en todo lo que necesites.
                    </p>
                    <span style="font-size: 30px;">🤍🌱</span>
                </div>
            `;
        }
    </script>
</body>
</html>
